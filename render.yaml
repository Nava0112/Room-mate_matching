services:
  # Backend API (FastAPI + Docker)
  - type: web
    name: roommate-matching-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ARTIFACT_DIR
        value: /app/ml/artifacts

  # Frontend Web App (React + Vite Static Site)
  - type: web
    name: roommate-matching-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
